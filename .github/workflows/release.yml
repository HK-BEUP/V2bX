name: HK-BEUP legacy release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable release tag'
        required: true
        default: 'v25.12.2-beup-legacy.1'
      publish:
        description: 'Publish both verified architectures as the latest release'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: beup-legacy-release
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOEXPERIMENT: jsonv2
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version
        run: '[[ "$VERSION" =~ ^v[0-9][A-Za-z0-9._-]{0,99}$ ]]'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Installer and failure recovery
        working-directory: release/install
        run: |
          python3 -m unittest -q test_upgrade.py
          bash -n install.sh V2bX.sh
          shellcheck -S error install.sh V2bX.sh
      - name: Legacy report and lifecycle integration
        run: go test -p 2 -count=1 -mod=readonly -tags 'xray beupqa' -run 'Legacy|InitialLegacy' ./api/panel ./node ./common/beuptransfer ./conf
      - name: REALITY and Vision loopback
        run: go test -p 2 -count=1 -timeout 120s -mod=readonly -tags xray -run TestREALITYVisionEncryptedLoopback ./core/xray
      - name: Package amd64 and arm64
        run: python3 release/package.py --source . --scripts release/install --version "$VERSION" --output candidate-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-packages
          path: candidate-artifacts/*
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ inputs.publish }}
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legacy-packages
          path: artifacts
      - name: Validate and publish once
        shell: bash
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          gh release create "$VERSION" V2bX-linux-64.zip V2bX-linux-arm64-v8a.zip SHA256SUMS package-verification.json --target "$SOURCE_SHA" --title "HK-BEUP Legacy Horizon $VERSION" --notes '旧 Redis/Horizon 增强版：稳定报告去重、持久化重试、退出尾流确认，新装日志关闭。支持 Linux/systemd amd64/arm64。已有配置和 journal 保留，既有节点不会自动更新。' --latest
