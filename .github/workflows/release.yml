# Replace .github/workflows/release.yml; artifact-only, no automatic publication.
name: HK-BEUP Xray candidate
on:
  push:
    branches: [beup/xray-observe-rc1]
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, e.g. v25.12.2-beup-observe-rc.1'
        required: true
      scripts_sha:
        description: 'Reviewed full commit SHA of HK-BEUP/V2bX-script'
        required: true
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOEXPERIMENT: jsonv2
      GOTOOLCHAIN: local
      VERSION: ${{ inputs.version || 'v25.12.2-beup-observe-rc.1' }}
      SCRIPTS_SHA: ${{ inputs.scripts_sha || 'b74ad979a2199e2a733dbfb14cd2881a11d13c40' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dispatch values
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9][A-Za-z0-9._-]{0,99}$ ]]
          [[ "$SCRIPTS_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: HK-BEUP/V2bX-script
          ref: ${{ env.SCRIPTS_SHA }}
          path: _install
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Installer fault tests
        run: |
          cd _install
          python3 -m unittest -v test_upgrade.py
          bash -n install.sh V2bX.sh
      - name: Observer and core race regression
        run: go test -count=1 -mod=readonly -race -tags xray -skip TestREALITYVisionEncryptedLoopback ./common/beupobserve ./core/xray/... ./cmd
      - name: Real REALITY and Vision acceptance
        # The pinned Xray Vision implementation uses unsafe pointer arithmetic;
        # normal build acceptance is separate from race/checkptr regression.
        run: go test -count=3 -timeout 120s -mod=readonly -tags xray -run TestREALITYVisionEncryptedLoopback ./core/xray
      - name: Build both Linux packages
        run: python3 release/package.py --source . --scripts _install --version "$VERSION" --output candidate-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: xray-candidate
          path: candidate-artifacts/*
          if-no-files-found: error
          retention-days: 14
